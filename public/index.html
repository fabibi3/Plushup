<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover : respecte l'encoche iPhone ; pas de zoom bloqué (accessibilité). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PlushUp" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html, body { height: 100%; background-color: #F7F5EF; }
      body { overflow: hidden; margin: 0; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; height: 100%; flex: 1; }
      /* Écran de chargement léger, visible avant l'exécution du JS (connexions lentes). */
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0F4648; }
      #boot svg { width: 72px; height: 72px; animation: b 1.6s ease-in-out infinite; }
      @keyframes b { 50% { transform: scale(1.08); } }
      #root:not(:empty) + #boot { display: none; }
    </style>
  </head>
  <body>
    <noscript>PlushUp a besoin de JavaScript pour fonctionner.</noscript>
    <div id="root"></div>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="20" fill="#155C5B"/><path d="M10 28c5-6 10-6 15 0s10 6 15 0 10-6 15 0" stroke="#BFE8D4" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M10 40c5-6 10-6 15 0s10 6 15 0 10-6 15 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
    </div>
  </body>
</html>
